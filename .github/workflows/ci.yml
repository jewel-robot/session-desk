name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Installs dependencies, builds the frontend and app, and runs go test and go vet.
      - name: Build
        run: .\build.ps1 -SkipInstaller
        # Long temp path: tests compare working directories, and the default TEMP is an 8.3 short path.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install chromium
      - name: Playwright
        working-directory: frontend
        run: npm test
